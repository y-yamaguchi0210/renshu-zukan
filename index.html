<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14304A">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="ball-icon-192.png">
<link rel="apple-touch-icon" href="ball-apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="練習図鑑">
</head><body>
<title>低学年バレー練習図鑑</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
/* レイアウト案：体育館でスマホ片手に使う道具。下のタブで「探す」と「今日のメニュー」を行き来し、実施画面は時間を一番大きく見せる */
:root{
  color-scheme:light;
  --ink:#14304A;--muted:#4A6175;--bg:#F2F6F9;--card:#FFFFFF;--line:#CBD9E4;
  --blue:#1B6CA8;--yellow:#F5BE1E;--coral:#C8402F;--green:#237A60;--soft-y:#FFF4CF;--soft-b:#E3F0F8;--soft-c:#FBE7E3;
  --display:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic',Meiryo,sans-serif;
  --body:'BIZ UDPGothic','Hiragino Sans','Yu Gothic',Meiryo,sans-serif;
  --nav:62px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--display);font-weight:900;line-height:1.35;margin:0;text-wrap:balance}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-block:14px calc(var(--nav) + 96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.wrap>*{min-width:0}
.top h1{font-size:clamp(22px,5vw,30px)}
.kicker{font-family:var(--display);font-weight:700;color:var(--blue);font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:34px;height:11px;flex:none}
/* 検索としぼりこみ */
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:grid;gap:8px;margin-top:-8px}
.filters.opened{position:static}
.search{display:block;width:100%;min-height:44px;padding:8px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--card);border-radius:99px;font-weight:700;font-size:14px;line-height:1.3;padding:7px 13px;min-height:36px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.more{display:grid;gap:8px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.more .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.more .row>b{width:100%;font-size:12.5px;color:var(--muted)}
.count{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.link{appearance:none;background:none;border:0;color:var(--blue);font-weight:700;font-size:14px;padding:6px 2px;text-decoration:underline;min-height:36px}
.sec-h{font-size:18px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:10px}
.badge{font-family:var(--body);font-size:12px;font-weight:700;padding:1px 9px;border-radius:99px;color:#fff}
.badge.on{background:var(--coral)}.badge.off{background:var(--blue)}
.sec-h small{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted)}
.list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.item{min-width:0;display:grid;grid-template-columns:minmax(0,1fr);background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative;content-visibility:auto;contain-intrinsic-size:auto 250px}
.item .open{appearance:none;display:block;width:100%;background:none;border:0;padding:0;text-align:left;min-width:0}
.art{display:block;width:100%;height:auto}
.item .txt{display:block;padding:9px 12px 11px;min-width:0}
.item .name{display:flex;gap:7px;align-items:center;font-family:var(--display);font-weight:900;font-size:16px;line-height:1.35;padding-right:82px;min-height:42px}
.no{display:inline-grid;place-items:center;flex:none;width:24px;height:24px;border-radius:50%;background:var(--yellow);font-family:var(--body);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.item .sub{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.acts{position:absolute;right:6px;bottom:6px;display:flex;gap:2px}
.icon{appearance:none;display:grid;place-items:center;width:40px;height:40px;background:var(--card);border:0;border-radius:50%;font-size:21px;line-height:1;color:var(--muted)}
.icon.fav[aria-pressed="true"]{color:#C78F00}
.icon.add{color:var(--blue);font-weight:700;font-size:25px}
.icon.add[aria-pressed="true"]{background:var(--blue);color:#fff;font-size:17px}
.empty{background:var(--soft-y);padding:14px 16px;border-radius:10px;font-size:15px}
.tips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 16px;margin:0;padding:0;list-style:none}
.tips li{min-width:0;border-top:2px solid var(--line);padding-top:6px;font-size:14px}
.tips b{display:block;font-family:var(--display)}
.about{display:grid;gap:12px;margin-top:18px}
.about h2{font-size:18px}
.fine{font-size:13px;color:var(--muted)}
/* 詳細 */
.detail{max-width:720px;width:100%;margin:0 auto;display:grid;gap:12px}
.detail>*{min-width:0}
.detail .art{border-radius:12px}
.detail h2{font-size:23px;display:flex;gap:9px;align-items:center}
.detail .no{width:30px;height:30px;font-size:14px}
.back{appearance:none;justify-self:start;background:none;border:0;color:var(--blue);font-weight:700;font-size:15px;padding:8px 2px;min-height:40px}
.gear{font-size:14px;color:var(--muted)}
.gear b{color:var(--ink)}
.src{display:inline-block;margin-left:6px;font-size:12px;line-height:1.5;padding:0 7px;border-radius:99px;background:var(--soft-y);color:var(--ink);white-space:nowrap}
.steps{margin:0;padding-left:1.4em;font-size:16px;line-height:1.65}
.adj{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;font-size:14.5px;line-height:1.5}
.adj div{min-width:0;background:var(--card);border:1px solid var(--line);padding:8px 11px;border-radius:8px}
.adj dt{font-weight:700;font-size:12.5px;color:var(--muted)}
.adj dd{margin:0}
.line{font-size:15px;line-height:1.6}
.line b{display:inline-block;font-size:12px;padding:0 7px;border-radius:4px;margin-right:7px;color:#fff}
.fun b{background:var(--green)}.vb b{background:var(--blue)}.safe b{background:var(--coral)}
.safe{background:var(--soft-c);padding:8px 11px;border-radius:8px}
.btn{appearance:none;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--ink);background:var(--card);border-radius:10px;font-weight:700;font-size:15px;padding:9px 14px;min-height:46px;text-align:center}
.btn.main{background:var(--ink);color:#fff}
.btn.go{background:var(--yellow);border-color:var(--ink);font-family:var(--display);font-weight:900;font-size:18px}
.btn[disabled]{opacity:.45;cursor:default}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
/* メニュー */
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;min-width:0}
.panel h2{font-size:18px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form label{display:grid;gap:3px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
.form select{min-height:44px;width:100%;padding:6px 9px;border:1.5px solid var(--line);border-radius:8px;background:#fff;font-size:16px;font-weight:400;color:var(--ink)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.total strong{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.plan{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pl{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;background:var(--bg);border-radius:9px;padding:8px;align-items:center;min-width:0}
.pl .art,.pl .wmini{border-radius:6px;width:76px;height:48px}
.wmini{display:grid;place-items:center;background:var(--soft-b);font-size:12px;font-weight:700;color:var(--blue)}
.pl .pname{appearance:none;display:block;background:none;border:0;padding:0;text-align:left;font-family:var(--display);font-weight:900;font-size:15px;line-height:1.35;min-width:0}
.pl .ctrl{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px}
.step{display:inline-flex;align-items:center;gap:2px}
.mini{appearance:none;width:40px;height:40px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);font-weight:700;font-size:16px;line-height:1;display:grid;place-items:center}
.mini[disabled]{opacity:.35}
.min{min-width:3.2em;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.savebar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.savebar input{min-height:46px;min-width:0;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
.saved{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.saved li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;border-top:1px solid var(--line);padding-top:6px}
.saved .nm{min-width:0;overflow-wrap:anywhere;font-weight:700}
.saved .nm small{display:block;font-weight:400;color:var(--muted)}
.copybox{width:100%;min-height:120px;padding:8px;font-size:14px;border:1.5px solid var(--line);border-radius:8px}
/* 実施 */
.run{max-width:720px;width:100%;margin:0 auto;display:grid;gap:10px;padding-block:10px 30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.run>*{min-width:0}
.run-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);width:0}
.run h2{font-size:clamp(22px,6vw,30px)}
.clock{font-family:var(--body);font-weight:700;font-size:clamp(68px,22vw,116px);line-height:1;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.clock.zero{color:var(--coral)}
.timeup{text-align:center;font-family:var(--display);font-weight:900;color:var(--coral);font-size:17px;min-height:1.6em}
.run .art{border-radius:12px}
.runbtns{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:8px}
.runbtns.up{grid-template-columns:1fr 2.5fr}
.water{display:grid;place-items:center;gap:4px;background:var(--soft-b);border-radius:12px;padding:30px 16px;text-align:center;font-family:var(--display);font-weight:900;font-size:20px;color:var(--blue)}
.water svg{width:60px;height:80px}
.next{font-size:14.5px;color:var(--muted)}
.next b{color:var(--ink)}
.fin{display:grid;gap:14px;text-align:center;padding:40px 0}
.fin h2{font-size:30px}
/* ナビ */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--ink);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.nav a{display:flex;align-items:center;justify-content:center;gap:8px;min-height:var(--nav);color:#C8D8E4;text-decoration:none;font-family:var(--display);font-weight:700;font-size:16px}
.nav a[aria-current="page"]{color:#fff;box-shadow:inset 0 4px 0 var(--yellow)}
.nav i{font-style:normal;display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--yellow);color:var(--ink);font-family:var(--body);font-weight:700;font-size:12.5px}
.gobar{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px));z-index:7;background:var(--bg);border-top:1px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gobar .btn{width:100%;max-width:720px;margin:0 auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 76px + env(safe-area-inset-bottom,0px));z-index:20;width:min(92vw,440px);display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:#fff;border-radius:10px;padding:10px 14px;font-size:14.5px}
.toast button{appearance:none;background:none;border:0;color:var(--yellow);font-weight:700;text-decoration:underline;min-height:32px;white-space:nowrap}
@media (max-width:860px){.list{grid-template-columns:repeat(2,minmax(0,1fr))}.tips{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){
 .list{grid-template-columns:minmax(0,1fr);gap:8px}
 .item{grid-template-columns:118px minmax(0,1fr);contain-intrinsic-size:auto 92px}
 .item .open{display:grid;grid-template-columns:118px minmax(0,1fr);grid-column:1/-1;align-items:stretch}
 .item .art{height:100%;min-height:92px;object-fit:cover}
 .item .txt{padding:8px 10px}
 .item .name{font-size:15px;padding-right:0;min-height:0}
 .item .sub{padding-right:84px;min-height:38px}
 .tips{grid-template-columns:minmax(0,1fr)}
 .form{grid-template-columns:minmax(0,1fr)}
}
@media print{.nav,.gobar,.filters,.toast{display:none}.item{break-inside:avoid}}
</style>

/* おまかせ作成：テーマ順に並べ、約20分ごとに水分補給を入れ、合計時間ぴったりにする */
function gen(o){
 var pool=DATA.filter(function(d){return d.n<=o.n&&(o.ball==='both'||String(d.ball)===o.ball)&&o.themes.indexOf(d.th)>=0});
 if(!pool.length)return null;
 var waters=Math.floor((o.total-1)/20),work=o.total-waters*3;
 var k=Math.max(1,Math.min(pool.length,Math.round(work/8)));
 while(k>1&&Math.floor(work/k)<3)k--;
 var used={},picks=[],lastBall=null,order=['リズム','体幹','判断'].filter(function(t){return o.themes.indexOf(t)>=0});
 for(var i=0;i<k;i++){
  var th=order[Math.floor(i*order.length/k)];
  var c=pool.filter(function(d){return !used[d.t]&&d.th===th});
  if(!c.length)c=pool.filter(function(d){return !used[d.t]});
  var c2=c.filter(function(d){return d.ball!==lastBall});
  if(o.ball==='both'&&c2.length)c=c2;
  var d=c[Math.floor(Math.random()*c.length)];
  used[d.t]=1;lastBall=d.ball;picks.push(d);
 }
 var base=Math.floor(work/k),rem=work-base*k,out=[],t=0,nextW=20;
 picks.forEach(function(d,i){
  var m=base+(i<rem?1:0);
  out.push({t:d.t,min:Math.min(30,m)});t+=m;
  if(out.filter(function(p){return p.w}).length<waters&&(t>=nextW-4||k-i-1<=waters-out.filter(function(p){return p.w}).length)&&i<k-1){out.push({w:1,min:3});t+=3;nextW=t+20}
 });
 var have=out.filter(function(p){return p.w}).length;
 while(have<waters){out.push({w:1,min:3});have++}
 return out;
}

 if(!n)e.textContent=F.fav&&!S.fav.length?'お気に入りはまだありません。各練習の ☆ を押すと、ここに集まります。':'この条件に合う練習はありません。言葉や条件を変えてみてください。';
 marks($('#list'));
}

/* 詳細 */
function renderDetail(d){
 if(view==='zukan')listY=window.scrollY;
 view='detail';setNav(lastTab());
 var ret=lastTab();
 $('#app').innerHTML='<div class="wrap"><article class="detail"><a class="back" href="#'+ret+'" style="text-decoration:none">← '+(ret==='menu'?'メニューへ戻る':'図鑑へ戻る')+'</a>'+art(d)+
 '<h2><span class="no">'+d.no+'</span>'+esc(d.t)+'</h2><p class="gear"><b>'+esc(d.p)+'</b>／'+esc(d.tool)+(d.src?'<span class="src">'+esc(d.src)+'</span>':'')+'</p>'+
 '<div class="btns"><button type="button" class="btn main" data-add2="'+esc(d.t)+'"></button><button type="button" class="btn" data-fav2="'+esc(d.t)+'"></button></div>'+
 stepsHtml(d)+'</article></div>';
 markDetail(d);window.scrollTo(0,0);
}
function stepsHtml(d){
 return '<ol class="steps">'+d.how.map(function(h){return '<li>'+esc(h)+'</li>'}).join('')+'</ol>'+
 '<dl class="adj"><div><dt>やさしく</dt><dd>'+esc(d.easy)+'</dd></div><div><dt>むずかしく</dt><dd>'+esc(d.hard)+'</dd></div></dl>'+
 '<p class="line fun"><b>楽しく</b>'+esc(d.fun)+'</p><p class="line vb"><b>効果</b>'+esc(d.vb)+'</p>'+(d.safe?'<p class="line safe"><b>安全</b>'+esc(d.safe)+'</p>':'');
}
function markDetail(d){
 $('[data-add2]').textContent=inPlan(d.t)?'✓ メニューから外す':'+ メニューに入れる';
 $('[data-fav2]').textContent=S.fav.indexOf(d.t)>=0?'★ お気に入り':'☆ お気に入り';
}
var tabMem='zukan';
function lastTab(){return tabMem}

/* メニュー */
function renderMenu(){
 view='menu';setNav('menu');
 var t=total();
 var h='<div class="wrap"><header class="top"><h1>今日のメニュー</h1></header>';
 h+='<section class="panel"><div class="total"><h2>'+(S.plan.length?'組んだ内容':'まだ空です')+'</h2>'+(S.plan.length?'<strong>合計 '+t+'分</strong>':'')+'</div>';
 if(S.plan.length){
  h+='<ul class="plan">'+S.plan.map(function(p,i){
   var d=p.w?null:byT[p.t];
   return '<li class="pl">'+(d?art(d):'<span class="wmini">休けい</span>')+(d?'<a class="pname" href="#m'+d.no+'" style="color:inherit">'+esc(d.t)+'</a>':'<span class="pname">水分補給</span>')+
   '<div class="ctrl"><span class="step"><button type="button" class="mini" data-m="-1" data-i="'+i+'" aria-label="1分短くする"'+(p.min<=1?' disabled':'')+'>−</button><span class="min">'+p.min+'分</span><button type="button" class="mini" data-m="1" data-i="'+i+'" aria-label="1分長くする"'+(p.min>=30?' disabled':'')+'>＋</button></span>'+
   '<span class="step"><button type="button" class="mini" data-mv="-1" data-i="'+i+'" aria-label="上へ動かす"'+(i===0?' disabled':'')+'>↑</button><button type="button" class="mini" data-mv="1" data-i="'+i+'" aria-label="下へ動かす"'+(i===S.plan.length-1?' disabled':'')+'>↓</button><button type="button" class="mini" data-rm="'+i+'" aria-label="メニューから外す">×</button></span></div></li>';
  }).join('')+'</ul>';
  h+='<div class="btns"><button type="button" class="btn" id="addw">＋ 水分補給</button><a class="btn" href="#zukan" style="text-decoration:none;color:inherit">＋ 図鑑から</a><button type="button" class="btn" id="copy">文章でコピー</button><button type="button" class="btn" id="clear">全部外す</button></div><div id="copyout"></div>';
 }else{
  h+='<p>下の「おまかせで作る」を使うか、図鑑の ＋ を押して練習を入れてください。</p><a class="btn" href="#zukan" style="text-decoration:none;color:inherit">図鑑をさがす</a>';
 }
 h+='</section>';
 h+='<section class="panel"><h2>おまかせで作る</h2><div class="form">'+
  sel('g-total','合計時間',[[15,'15分'],[30,'30分'],[45,'45分'],[60,'60分'],[90,'90分'],[120,'120分']],G.total)+
  sel('g-n','今日の人数',[[1,'1人'],[2,'2人'],[3,'3人'],[4,'4人以上']],G.n)+
  sel('g-ball','ボール',[['both','あり・なし両方'],['1','ボールあり'],['0','ボールなし']],G.ball)+
  '</div><div class="checks" role="group" aria-label="入れるテーマ">'+['リズム','体幹','判断'].map(function(t){return chip('data-gt="'+t+'"',TH[t],G.themes.indexOf(t)>=0)}).join('')+'</div>'+
  '<p class="fine">テーマの順に並べ、約20分ごとに水分補給を入れます。今のメニューは置きかわります。</p>'+
  '<button type="button" class="btn main" id="gen"'+(G.themes.length?'':' disabled')+'>'+(G.themes.length?'おまかせで作る':'テーマを1つ以上選んでください')+'</button></section>';
 h+='<section class="panel"><h2>保存したメニュー</h2>';
 if(S.plan.length)h+='<form class="savebar" id="saveform"><input id="savename" type="text" maxlength="30" placeholder="名前（例：雨の日30分）" aria-label="メニューの名前"><button class="btn" type="submit">保存</button></form>';
 h+=S.saved.length?'<ul class="saved">'+S.saved.map(function(m,i){return '<li><span class="nm">'+esc(m.name)+'<small>'+m.items.filter(function(p){return !p.w}).length+'種目・'+total(m.items)+'分</small></span><span class="step" style="gap:6px"><button type="button" class="btn" style="min-height:40px;padding:5px 12px" data-load="'+i+'">開く</button><button type="button" class="mini" data-del="'+i+'" aria-label="'+esc(m.name)+'を削除">×</button></span></li>'}).join('')+'</ul>':'<p class="fine">よく使う組み合わせを保存すると、次回すぐ開けます。</p>';
 h+='</section>';
 if(S.plan.length)h+='<div class="gobar"><a class="btn go" href="#run" style="text-decoration:none;color:inherit">▶ タイマーで始める（'+t+'分）</a></div>';
 h+='</div>';
 var y=window.scrollY;$('#app').innerHTML=h;window.scrollTo(0,y);
}
function sel(id,label,opts,val){return '<label for="'+id+'">'+label+'<select id="'+id+'">'+opts.map(function(o){return '<option value="'+o[0]+'"'+(String(o[0])===String(val)?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></label>'}
function planText(){
 var a=['今日の練習（合計'+total()+'分）'];
 S.plan.forEach(function(p,i){a.push((i+1)+'. '+(p.w?'水分補給':p.t)+' '+p.min+'分')});
 return a.join('\n');
}

/* 実施 */
function renderRun(){
 view='run';setNav(null);
 if(!R)startRun();
 drawRun();
}
function startRun(){
 R={i:0,left:S.plan[0].min*60,end:0,on:false,done:false,beeped:false,quit:false};
 try{R.ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
 lock();
 R.timer=setInterval(tick,250);
 go(true);
}
function lock(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){if(R)R.lock=l;else l.release()}).catch(function(){})}catch(e){}}
function stopRun(){if(!R)return;clearInterval(R.timer);try{R.lock&&R.lock.release()}catch(e){}try{R.ac&&R.ac.close()}catch(e){}R=null}
function go(on){R.on=on;if(on)R.end=Date.now()+R.left*1000}
function tick(){
 if(!R||!R.on)return;
 R.left=Math.max(0,(R.end-Date.now())/1000);
 if(R.left<=0){R.on=false;R.left=0;if(!R.beeped){R.beeped=true;beep()}drawRun();return}
 drawClock();
}
function beep(){
 try{navigator.vibrate&&navigator.vibrate([300,120,300])}catch(e){}
 try{var a=R.ac;if(!a)return;if(a.state==='suspended')a.resume();[0,.45,.9].forEach(function(s){var o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);var t=a.currentTime+s;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.5,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.start(t);o.stop(t+.36)})}catch(e){}
}
function fmt(s){s=Math.ceil(s);return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
function drawClock(){
 var c=$('#clock');if(!c)return;c.textContent=fmt(R.left);c.classList.toggle('zero',R.left<=0);
 var b=$('#runbar');if(b){var done=S.plan.slice(0,R.i).reduce(function(n,p){return n+p.min*60},0)+(S.plan[R.i].min*60-R.left);b.style.width=Math.min(100,done/(total()*60)*100)+'%'}
}
function drawRun(){
 if(R.done){$('#app').innerHTML='<div class="run"><div class="fin"><h2>おつかれさまでした</h2><p>'+S.plan.length+'個のメニュー、合計'+total()+'分が終わりました。</p><a class="btn main" href="#menu" style="text-decoration:none">メニューへ戻る</a></div></div>';return}
 var p=S.plan[R.i],d=p.w?null:byT[p.t],nx=S.plan[R.i+1];
 var y=window.scrollY;
 $('#app').innerHTML='<div class="run"><div class="run-top"><span>'+(R.i+1)+' / '+S.plan.length+'</span><button type="button" class="link" id="quit">'+(R.quit?'もう一度押すと終わります':'終わる')+'</button></div><div class="bar"><i id="runbar"></i></div>'+
 '<h2>'+(d?'<span class="no" style="width:30px;height:30px;font-size:14px;vertical-align:4px;margin-right:8px">'+d.no+'</span>'+esc(d.t):'水分補給')+'</h2>'+
 '<div class="clock" id="clock" role="timer"></div><p class="timeup">'+(R.left<=0?'時間です。次へ進みましょう':'')+'</p>'+
 '<div class="runbtns'+(R.left<=0?' up':'')+'"><button type="button" class="btn" id="prev"'+(R.i===0?' disabled':'')+'>← 前へ</button>'+(R.left<=0?'<button type="button" class="btn go" id="next2">'+(nx?'次へ →':'終わる')+'</button>':'<button type="button" class="btn main" id="play">'+(R.on?'一時停止':'再開')+'</button><button type="button" class="btn" id="next">'+(nx?'次へ →':'終わる')+'</button>')+'</div>'+
 '<button type="button" class="btn" id="plus1">＋1分</button>'+
 (d?art(d)+stepsHtml(d):'<div class="water"><svg viewBox="0 0 60 80" aria-hidden="true"><path d="M8 6H52L46 74H14Z" fill="#fff" stroke="#1B6CA8" stroke-width="4"/><path d="M11 30H49L45 71H15Z" fill="#7FB6DA"/></svg>水分をとって、ひと休み</div>')+
 '<p class="next">'+(nx?'次：<b>'+esc(nx.w?'水分補給':nx.t)+'</b>（'+nx.min+'分）':'これが最後です')+'</p></div>';
 drawClock();window.scrollTo(0,y);
}
function move(step){
 var ni=R.i+step;
 if(ni>=S.plan.length){R.done=true;R.on=false;try{R.lock&&R.lock.release()}catch(e){}drawRun();window.scrollTo(0,0);return}
 if(ni<0)return;
 R.i=ni;R.left=S.plan[ni].min*60;R.beeped=false;R.quit=false;go(true);drawRun();window.scrollTo(0,0);
}

/* 操作 */
document.addEventListener('click',function(e){
 var b=e.target.closest('button,a');if(!b)return;
 var ds=b.dataset;
 if(ds.f){
  if(ds.f==='th')F.th=ds.v;else if(ds.f==='ball')F.ball=ds.v;else if(ds.f==='n')F.n=+ds.v;else if(ds.f==='free')F.free=!F.free;else if(ds.f==='fav')F.fav=!F.fav;else if(ds.f==='open')F.open=!F.open;
  drawChips();applyF();return;
 }
 if(ds.fav!==undefined){toggleFav(ds.fav);if(F.fav)applyF();else marks($('#list'));return}
 if(ds.add!==undefined){toggleAdd(ds.add);marks($('#list'));countNav();return}
 if(ds.fav2!==undefined){toggleFav(ds.fav2);markDetail(byT[ds.fav2]);return}
 if(ds.add2!==undefined){toggleAdd(ds.add2);markDetail(byT[ds.add2]);countNav();return}
 if(ds.m){var p=S.plan[+ds.i];p.min=Math.max(1,Math.min(30,p.min+(+ds.m)));save();renderMenu();return}
 if(ds.mv){var i=+ds.i,j=i+(+ds.mv),x=S.plan[i];S.plan[i]=S.plan[j];S.plan[j]=x;save();renderMenu();return}
 if(ds.rm!==undefined){var prev=S.plan.slice(),nm=S.plan[+ds.rm];S.plan.splice(+ds.rm,1);save();renderMenu();countNav();toast((nm.w?'水分補給':nm.t)+'を外しました',function(){S.plan=prev;save()});return}
 if(ds.gt){var k=G.themes.indexOf(ds.gt);if(k>=0)G.themes.splice(k,1);else G.themes.push(ds.gt);renderMenu();return}
 if(ds.load!==undefined){var old=S.plan;S.plan=S.saved[+ds.load].items.map(function(p){return Object.assign({},p)});save();renderMenu();countNav();window.scrollTo(0,0);toast('「'+S.saved[+ds.load].name+'」を開きました',function(){S.plan=old;save()});return}
 if(ds.del!==undefined){var sv=S.saved.slice(),n2=S.saved[+ds.del].name;S.saved.splice(+ds.del,1);save();renderMenu();toast('「'+n2+'」を削除しました',function(){S.saved=sv;save()});return}
 switch(b.id){
  case 'addw':S.plan.push({w:1,min:3});save();renderMenu();countNav();return;
  case 'clear':var c=S.plan;S.plan=[];save();renderMenu();countNav();toast('メニューを空にしました',function(){S.plan=c;save()});return;
  case 'gen':
   G.total=+$('#g-total').value;G.n=+$('#g-n').value;G.ball=$('#g-ball').value;
   var o=gen(G),before=S.plan;
   if(!o){toast('この条件に合う練習がありません。人数やボールを変えてください');return}
   S.plan=o;save();renderMenu();countNav();window.scrollTo(0,0);toast('メニューを作りました',function(){S.plan=before;save()});return;
  case 'copy':
   var t=planText();
   var fb=function(){$('#copyout').innerHTML='<textarea class="copybox" readonly aria-label="メニューの文章">'+esc(t)+'</textarea>';$('#copyout textarea').select();toast('文章を選んでコピーしてください')};
   try{navigator.clipboard.writeText(t).then(function(){toast('コピーしました')},fb)}catch(er){fb()}
   return;
  case 'play':if(R.on){R.left=Math.max(0,(R.end-Date.now())/1000);go(false)}else{go(true)}drawRun();return;
  case 'next':case 'next2':move(1);return;
  case 'prev':move(-1);return;
  case 'plus1':R.left=(R.on?Math.max(0,(R.end-Date.now())/1000):R.left)+60;R.beeped=false;go(true);drawRun();return;
  case 'quit':
   if(R.quit){location.hash='menu';return}
   R.quit=true;drawRun();setTimeout(function(){if(R&&R.quit){R.quit=false;if(!R.done)drawRun()}},3000);return;
 }
});
document.addEventListener('submit',function(e){
 if(e.target.id!=='saveform')return;
 e.preventDefault();
 var nm=$('#savename').value.trim()||('メニュー'+(S.saved.length+1));
 S.saved.push({name:nm,items:S.plan.map(function(p){return Object.assign({},p)})});save();renderMenu();toast('「'+nm+'」を保存しました');
});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&R&&!R.done)lock()});
function toggleFav(t){var i=S.fav.indexOf(t);if(i>=0)S.fav.splice(i,1);else S.fav.push(t);save()}
function toggleAdd(t){
 var i=-1;S.plan.forEach(function(p,k){if(p.t===t)i=k});
 if(i>=0)S.plan.splice(i,1);else{S.plan.push({t:t,min:8});toast(t+'を入れました')}
 save();
}
function countNav(){var c=document.getElementById('navcount');c.hidden=!S.plan.length;c.textContent=S.plan.length}
window.addEventListener('hashchange',function(){
 var h=(location.hash||'').slice(1);
 if(h==='menu'||h==='zukan'||h==='')tabMem=h||'zukan';
 $('#toast').hidden=true;
 render();
});
(function(){var h=(location.hash||'').slice(1);if(h==='menu')tabMem='menu'})();
load();render();
</script>
